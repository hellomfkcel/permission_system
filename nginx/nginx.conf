# 权限平台独立反代 — 让权限系统不依赖 RAG nginx
# 职责：
#   /realms/ → Keycloak（独立入口；X-Forwarded-Host 用 $http_host 携带非默认端口）
#   /        → admin-console（管理台）
# 浏览器访问：http://EXTERNAL_HOST:${PERMISSION_NGINX_PORT:-18081}

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # HTTP-only 部署：剥离 Keycloak 无差别下发的 Strict-Transport-Security。
    # 本部署 TLS 由外部 LB 终结、内部全 http；HSTS 会让浏览器缓存后强制升级 https
    # 到并不存在的 TLS 端口，导致"无法访问此网站"。
    proxy_hide_header Strict-Transport-Security;

    server {
        listen 80;
        server_name _;

        # ── Keycloak：权限平台自己的 /realms 入口 ──
        # $http_host = Host 头（含非默认端口，如 81.69.250.221:18081）
        # → Keycloak 生成 http://EXTERNAL_HOST:18081/realms/... URL（RAG 停摆不受影响）
        location /realms/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            # 必须传外部端口：Keycloak v1 hostname 用它生成 http://EXTERNAL_HOST:18081 URL
            # （否则用 scheme 默认端口 80 → 表单提交走 RAG nginx → 权限平台被 RAG 绑架）
            proxy_set_header X-Forwarded-Port 18081;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            # http-only 部署修复：Keycloak 24 即便 ssl-required=none 也对会话 cookie 打
            # Secure;SameSite=None → 浏览器在 http 下不发送/拒绝存储 → 登录 POST 丢会话
            # （"Cookie not found"）。此处剥离 Secure 与 SameSite（回退浏览器默认 Lax）。
            proxy_cookie_flags AUTH_SESSION_ID nosecure nosamesite;
            proxy_cookie_flags AUTH_SESSION_ID_LEGACY nosecure nosamesite;
            proxy_cookie_flags KC_RESTART nosecure nosamesite;
            proxy_cookie_flags KC_STATE_CHECKER nosecure nosamesite;
        }

        # ── Keycloak admin 控制台（创建用户/角色等 IdP 管理） ──
        # 经 :18081/admin 可达（Keycloak 管理台），不依赖 RAG nginx。
        # 裸 /admin → 302 到控制台（否则落到 Next.js 404）。
        # 必须用 $http_host（含端口）拼绝对 URL：nginx 的 `return 302 /path` 用 $host 不带端口，
        # 会生成 http://EXTERNAL_HOST/...（端口 80=RAG nginx）→ 301 https → Next.js 404。
        location = /admin {
            return 302 http://$http_host/admin/master/console/;
        }
        location /admin/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
        }

        # ── 资源管理（admin-console SPA 路由）──
        # /resources、/resources/、/resources/kb/*、/resources/document/* 是权限平台 SPA 的
        # "资源管理"页与深链。必须用 精确(=) + 正则(~) 优先于下方 Keycloak 的 /resources/（主题资源），
        # 否则被 Keycloak 捕获 → 资源管理页 301 到 80 端口 / 404。
        location = /resources {
            proxy_pass http://admin-console:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location = /resources/ {
            proxy_pass http://admin-console:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location ~ ^/resources/(kb|document)/ {
            proxy_pass http://admin-console:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Keycloak 主题/静态资源（admin 控制台必需；其余 /resources/*） ──
        location /resources/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
        }

        # ── 权限服务管理 API（admin-console 同源 /api/v1 访问） ──
        # admin-console 的 NEXT_PUBLIC_PERMISSION_SERVICE_URL 指向 http://EXTERNAL_HOST:18081，
        # /api/v1/* 由本 nginx 转发到 permission-service（容器内 8080）。
        # 避免单独为权限服务开外网端口（18080 外网已被 RAG 占用）。
        location /api/v1/ {
            proxy_pass http://permission-service:8080;
            # $http_host 带端口：权限服务/Next 用 Host 拼重定向与回调，丢端口会跳 80
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # ── admin-console ──
        # 容器内服务端口是 3000（宿主映射 3002 仅外部直连用）；写 3002 在 docker 网络里连接被拒 → 502
        location / {
            proxy_pass http://admin-console:3000;
            # $http_host 带端口：Next.js 尾斜杠重定向（/resources → /resources/）用 Host 拼绝对 URL，
            # 用 $host（无端口）会跳 http://HOST/resources/（80 端口）→ 不可访问
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
