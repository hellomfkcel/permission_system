# 外部权限管理系统 — Docker Compose 编排
# 设计依据：docs/外部系统设计.md §6 部署架构 + docs/外部系统实施方案.md §12
#
# 启动方式:
#   docker compose up -d perm-postgres perm-redis cerbos keycloak   # 基础设施 + Keycloak
#   docker compose up -d permission-service admin-console           # 应用服务
#   docker compose up -d                                            # 全部服务
#（Keycloak 已并入本编排；既有独立 IdP 部署时可移除 keycloak 服务并改
#  KEYCLOAK_SERVER_URL 指向既有 IdP）

services:
  # ════════════════════════════════════════════════════════
  # 权限服务独立数据库
  # ════════════════════════════════════════════════════════
  perm-postgres:
    image: postgres:16-alpine
    container_name: perm-postgres
    environment:
      POSTGRES_DB: permission_db
      # 生产部署必须覆盖为强口令（PRODUCTION=true 时校验拒绝默认凭据）。
      # 注意：仅对首次初始化的空数据卷生效；既有数据卷需保留原凭据或重建。
      POSTGRES_USER: ${POSTGRES_USER:-perm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perm_pass}
    ports:
      - "${PERM_POSTGRES_HOST_PORT:-25433}:5432"
    volumes:
      - perm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perm_user} -d permission_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - perm-network

  # ════════════════════════════════════════════════════════
  # 权限事件 Redis（开发阶段可复用 RAG Redis :16379）
  # ════════════════════════════════════════════════════════
  perm-redis:
    image: redis:7-alpine
    container_name: perm-redis
    command: redis-server --requirepass ${PERM_REDIS_PASSWORD:-perm_redis_pwd_2026} --appendonly yes
    ports:
      - "${PERM_REDIS_HOST_PORT:-16380}:6379"
    volumes:
      - perm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PERM_REDIS_PASSWORD:-perm_redis_pwd_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - perm-network

  # ════════════════════════════════════════════════════════
  # Keycloak IdP — 身份源服务
  # 说明：已并入本编排（原 docker-compose.keycloak.yml）。
  #       permission-service 经 http://keycloak:8080 直连；宿主 8080 端口供
  #       admin-console 浏览器与 RAG 侧（host.docker.internal:8080）访问。
  #       既有独立 IdP 部署时可移除本服务并改 KEYCLOAK_SERVER_URL 指向之。
  # ════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: perm-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --http-port=8080
      - --health-enabled=true
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - perm-network
    healthcheck:
      test: ["CMD", "timeout", "3", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ════════════════════════════════════════════════════════
  # 权限服务后端
  # ════════════════════════════════════════════════════════
  permission-service:
    build: ./permission-service
    container_name: permission-service
    ports:
      - "${PERMISSION_SERVICE_HOST_PORT:-18080}:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-perm_user}:${POSTGRES_PASSWORD:-perm_pass}@perm-postgres:5432/permission_db
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-perm_user}:${POSTGRES_PASSWORD:-perm_pass}@perm-postgres:5432/permission_db
      CERBOS_PDP_URL: http://cerbos:3592
      CERBOS_POLICIES_DIR: /policies
      REDIS_URL: redis://:${PERM_REDIS_PASSWORD:-perm_redis_pwd_2026}@perm-redis:6379/0
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      # 签发会话 token 需私钥（与 RAG 共用同一密钥对；init_secrets 从 RAG_CONFIG_DIR 同步）
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      # Keycloak 同编排内直连（容器网络），不再依赖 host.docker.internal
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: rag-v14
      KEYCLOAK_CLIENT_ID: permission-service
      KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: INFO
      # ── 生产加固配置 ──
      # PRODUCTION=true 会校验强凭据（DB 非默认口令、Redis 带密码、JWT 密钥在、SERVICE_API_KEY 在）。
      # 开发环境置 false；生产必须 true 并配强口令。TLS 由外部 LB/Ingress 终结，服务内为 HTTP。
      PRODUCTION: ${PRODUCTION:-true}
      CTX_TOKEN_SECRET_FILE: /run/secrets/ctx_token_secret
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      # 服务间 API Key（生产环境通过 Docker secret 注入）
      SERVICE_API_KEY_FILE: /run/secrets/service_api_key
      # Keycloak admin 凭据（生产环境通过 Docker secret 注入）
      KEYCLOAK_ADMIN_USERNAME_FILE: /run/secrets/keycloak_admin_username
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
    secrets:
      - jwt_public_key
      - jwt_private_key
      - keycloak_client_secret
      - ctx_token_secret
      - tls_cert
      - tls_key
      - service_api_key
      - keycloak_admin_username
      - keycloak_admin_password
    volumes:
      # 权限服务与 Cerbos 共享策略目录：前者解析角色→动作映射，后者求值规则
      - ./cerbos/policies:/policies
    depends_on:
      perm-postgres:
        condition: service_healthy
      perm-redis:
        condition: service_healthy
      cerbos:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # 镜像内无 curl，使用 Python 探测
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - perm-network
    # Linux 下访问宿主 Keycloak（KEYCLOAK_SERVER_URL=http://host.docker.internal:8080）
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ════════════════════════════════════════════════════════
  # Cerbos PDP — 策略决策点
  # 策略目录挂载为 /policies，与权限服务共享同一份文件
  # （权限服务需解析同一批策略，见 services/cerbos_policy_parser.py）。
  # ════════════════════════════════════════════════════════
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.39.0
    container_name: perm-cerbos
    command: ["server", "--config=/config/.cerbos.yaml"]
    # 宿主机端口参数化：避免与 RAG 基础设施中的 cerbos(13592) 冲突。
    # permission-service 在容器内经 http://cerbos:3592 访问，不受宿主端口影响；
    # 宿主端口仅用于外部调试（cerbosctl / curl）。
    ports:
      - "${CERBOS_HTTP_PORT:-14592}:3592"
      - "${CERBOS_GRPC_PORT:-14593}:3593"
    volumes:
      - ./cerbos/policies:/policies
      - ./cerbos/.cerbos.yaml:/config/.cerbos.yaml:ro
      - perm_cerbos_audit:/audit
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/.cerbos.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - perm-network

  # ════════════════════════════════════════════════════════
  # 管理台前端
  #
  # NEXT_PUBLIC_* 变量在构建时嵌入浏览器端代码。
  # 浏览器无法解析 Docker 内部服务名，因此必须使用宿主机可达地址。
  # 通过 EXTERNAL_HOST 环境变量或 .env 文件配置（默认 localhost）。
  # ════════════════════════════════════════════════════════
  admin-console:
    build:
      context: ./admin-console
      args:
        # NEXT_PUBLIC_* 构建时内联进 JS 束，浏览器按此地址访问
        # 权限服务/Keycloak（EXTERNAL_HOST 须为浏览器可达 IP/域名，非 localhost）
        NEXT_PUBLIC_PERMISSION_SERVICE_URL: http://${EXTERNAL_HOST:-localhost}:${PERMISSION_SERVICE_HOST_PORT:-18080}
        NEXT_PUBLIC_KEYCLOAK_URL: http://${EXTERNAL_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: rag-v14
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: admin-console
    container_name: admin-console
    ports:
      - "${ADMIN_CONSOLE_HOST_PORT:-3002}:3000"
    environment:
      # 运行时也保留（与服务端渲染一致）；构建期内联由 build.args 负责
      NEXT_PUBLIC_PERMISSION_SERVICE_URL: http://${EXTERNAL_HOST:-localhost}:${PERMISSION_SERVICE_HOST_PORT:-18080}
      NEXT_PUBLIC_KEYCLOAK_URL: http://${EXTERNAL_HOST:-localhost}:${KEYCLOAK_HOST_PORT:-8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: rag-v14
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: admin-console
      # Next.js standalone server.js 默认用容器 hostname 绑定 → DNS 解析失败(EAI_AGAIN)；
      # 显式绑定 0.0.0.0 才能对外服务（3002:3000）。
      HOSTNAME: "0.0.0.0"
    depends_on:
      - permission-service
    restart: unless-stopped
    networks:
      - perm-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Secrets 默认从仓库内 permission-service/config/ 读取（该目录已在 .gitignore 中）。
# 生产部署可通过 SECRETS_DIR 指向仓库外的挂载点，例如：
#   SECRETS_DIR=/etc/permission-platform/secrets docker compose up -d
secrets:
  jwt_public_key:
    file: ${SECRETS_DIR:-./permission-service/config}/jwt_public.pem
  jwt_private_key:
    file: ${SECRETS_DIR:-./permission-service/config}/jwt_private.pem
  keycloak_client_secret:
    file: ${SECRETS_DIR:-./permission-service/config}/keycloak_client_secret
  ctx_token_secret:
    file: ${SECRETS_DIR:-./permission-service/config}/ctx_token_secret
  tls_cert:
    file: ${SECRETS_DIR:-./permission-service/config}/tls_cert.pem
  tls_key:
    file: ${SECRETS_DIR:-./permission-service/config}/tls_key.pem
  service_api_key:
    file: ${SECRETS_DIR:-./permission-service/config}/service_api_key
  keycloak_admin_username:
    file: ${SECRETS_DIR:-./permission-service/config}/keycloak_admin_username
  keycloak_admin_password:
    file: ${SECRETS_DIR:-./permission-service/config}/keycloak_admin_password

volumes:
  perm_pgdata:
  perm_redis_data:
  perm_cerbos_audit:
  keycloak_data:

networks:
  perm-network:
    driver: bridge
