# Keycloak IdP — 身份源服务
# 设计依据：docs/外部系统设计方案.md §7 Keycloak 配置 + docs/外部系统设计.md §4.1
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: perm-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --http-port=8080
      - --health-enabled=true
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "timeout", "3", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  keycloak_data:
