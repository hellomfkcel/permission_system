server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"

storage:
  driver: disk
  disk:
    directory: /policies
    watchForChanges: true

schema:
  enforcement: warn

audit:
  enabled: true
  backend: local
  local:
    storagePath: /audit
    # 保留期 720h（30 天）= Cerbos local backend 上限；本地 audit 卷已纳入
    # scripts/backup.sh 备份（cerbos-audit.tar.gz），备份+保留双保险。
    # 更长期保留需集中化（Kafka/远程 audit sink），列为后续演进。
    retentionPeriod: 720h
