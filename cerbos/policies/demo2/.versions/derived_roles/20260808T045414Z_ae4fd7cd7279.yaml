apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: oa_roles
  definitions:
    - name: oa_employee
      description: 普通员工 — 提交请假/报销申请，查看公司公告
      parentRoles: ["user"]

    - name: oa_manager
      description: 部门经理 — 继承员工权限，审批本部门请假/报销，查看本部门员工档案
      parentRoles: ["oa_employee"]

    - name: oa_hr
      description: HR — 继承员工权限，管理全公司员工档案、查看薪资、绩效评估
      parentRoles: ["oa_employee"]

    - name: oa_ceo
      description: CEO — 继承经理+HR全部权限，管理所有资源
      parentRoles: ["oa_manager", "oa_hr"]
