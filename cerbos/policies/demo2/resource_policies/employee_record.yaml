apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "oa_employee_record"
  version: "default"
  importDerivedRoles:
    - oa_roles
  rules:
    # 普通员工：只能查看自己的基础档案
    - actions: ["read:own"]
      effect: EFFECT_ALLOW
      roles: ["oa_employee"]

    # 部门经理：查看本部门员工基础档案
    - actions: ["read:department", "update:department"]
      effect: EFFECT_ALLOW
      roles: ["oa_manager"]

    # HR：管理全公司员工档案（含薪资敏感信息）
    - actions: ["read:all", "create", "update:all", "view_salary"]
      effect: EFFECT_ALLOW
      roles: ["oa_hr"]

    # CEO：全部操作
    - actions: ["read:all", "update:all", "view_salary", "delete"]
      effect: EFFECT_ALLOW
      roles: ["oa_ceo"]
