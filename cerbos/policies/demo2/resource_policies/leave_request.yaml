apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "oa_leave_request"
  version: "default"
  importDerivedRoles:
    - oa_roles
  rules:
    # 普通员工：创建、查看自己的请假、取消待审批的申请
    - actions: ["create", "read:own", "cancel"]
      effect: EFFECT_ALLOW
      roles: ["oa_employee"]

    # 部门经理：查看本部门请假、审批/驳回
    - actions: ["read:department", "approve", "reject"]
      effect: EFFECT_ALLOW
      roles: ["oa_manager"]

    # HR：查看全公司请假记录（用于考勤统计）
    - actions: ["read:all"]
      effect: EFFECT_ALLOW
      roles: ["oa_hr"]

    # CEO：全部操作
    - actions: ["read:all", "approve", "reject", "cancel", "delete"]
      effect: EFFECT_ALLOW
      roles: ["oa_ceo"]
