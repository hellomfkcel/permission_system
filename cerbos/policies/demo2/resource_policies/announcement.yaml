apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "oa_announcement"
  version: "default"
  importDerivedRoles:
    - oa_roles
  rules:
    # 所有员工：查看公告
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["oa_employee"]

    # 部门经理：发布本部门公告
    - actions: ["create:department", "update:department", "delete:department"]
      effect: EFFECT_ALLOW
      roles: ["oa_manager"]

    # HR：发布全公司公告（如制度更新、放假通知）
    - actions: ["create:all", "update:all", "delete:all"]
      effect: EFFECT_ALLOW
      roles: ["oa_hr"]

    # CEO：全部操作
    - actions: ["create:all", "update:all", "delete:all"]
      effect: EFFECT_ALLOW
      roles: ["oa_ceo"]
