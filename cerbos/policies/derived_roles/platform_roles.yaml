# 平台管理功能的派生角色。
# 与 app/platform_features.py 的功能目录、迁移 a1b2c3d4e5f6 的种子角色对应。
# 放在策略根目录（无项目归属），对全部项目可见。
apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: platform_roles
  definitions:
    - name: platform_admin_role
      parentRoles: ["platform_admin", "system_admin"]
      condition:
        match:
          expr: "true"

    - name: platform_viewer_role
      parentRoles: ["platform_viewer"]
      condition:
        match:
          expr: "true"

    - name: platform_granted
      parentRoles: ["user"]
      condition:
        match:
          expr: >
            has(request.principal.attr.granted_actions) &&
            request.resource.id in request.principal.attr.granted_actions
