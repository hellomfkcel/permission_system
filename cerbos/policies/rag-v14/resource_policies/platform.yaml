# Cerbos Platform Management Resource Policy
# Resource: platform
# Resource IDs: dashboard, project_mgmt, tenant_mgmt, resource_mgmt, user_mgmt,
#               role_mgmt, permission_mgmt, restriction_mgmt, policy_mgmt,
#               audit_mgmt, playground, settings
# Actions: platform:read, platform:write
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "platform"
  importDerivedRoles:
    - rag_roles
  rules:
    - actions: ["platform:read"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - admin
      condition:
        match:
          expr: request.resource.attr.retired == false

    - actions: ["platform:read"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - kb_reader
        - kb_writer
        - kb_admin
        - user
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.retired == false
              - expr: request.principal.attr.granted_actions != null && request.principal.attr.granted_actions != {} && (request.principal.attr.granted_actions[request.resource.id].exists(x, x == "platform:read") || request.principal.attr.granted_actions[request.resource.id].exists(x, x == "platform:write"))

    - actions: ["platform:write"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - admin
      condition:
        match:
          expr: request.resource.attr.retired == false

    - actions: ["platform:write"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - kb_reader
        - kb_writer
        - kb_admin
        - user
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.retired == false
              - expr: request.principal.attr.granted_actions != null && request.principal.attr.granted_actions[request.resource.id].exists(x, x == "platform:write")
